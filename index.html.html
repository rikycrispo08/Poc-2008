<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rosa & Formazione</title>
<style>
:root{--bg:#f4f6f4;--card:#fff;--tx:#1b2a1f;--mu:#667;--bd:#d9dfd9;--ac:#1f8a4c;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121813;--card:#1c241e;--tx:#e8efe9;--mu:#9aa89d;--bd:#2d392f;--ac:#3cc178}}
:root[data-theme="dark"]{--bg:#121813;--card:#1c241e;--tx:#e8efe9;--mu:#9aa89d;--bd:#2d392f;--ac:#3cc178}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,Segoe UI,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);z-index:5;display:flex;gap:8px;padding:10px 12px;border-bottom:1px solid var(--bd)}
header button{flex:1;padding:10px;border:1px solid var(--bd);background:var(--card);color:var(--tx);border-radius:10px;font-weight:600;font-size:15px}
header button.on{background:var(--ac);color:#fff;border-color:var(--ac)}
main{max-width:900px;margin:0 auto;padding:12px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px;padding:12px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
label{display:block;font-size:12px;color:var(--mu);margin-bottom:2px}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit}
.full{grid-column:1/-1}
.btn{padding:10px 14px;border:0;border-radius:8px;background:var(--ac);color:#fff;font-weight:600;font-size:15px}
.btn.s{background:transparent;color:var(--tx);border:1px solid var(--bd)}
.btn.d{background:transparent;color:#d33;border:1px solid var(--bd)}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p{display:flex;gap:10px;align-items:flex-start}
.badge{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:#fff;font-weight:700;font-size:13px}
.P{background:#e0a100}.D{background:#2a6fdb}.C{background:#1f8a4c}.A{background:#d33a3a}
.st{font-size:13px;color:var(--mu)}
.st b{color:var(--tx)}
.pitch{position:relative;width:100%;max-width:440px;margin:0 auto 12px;aspect-ratio:68/100;background:repeating-linear-gradient(#2e9a55 0 10%,#33a45b 10% 20%);border:3px solid #fff;border-radius:6px;touch-action:none;overflow:hidden}
.pitch svg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.tok{position:absolute;transform:translate(-50%,-50%);text-align:center;cursor:grab;user-select:none;touch-action:none;width:64px}
.tok .badge{margin:0 auto;border:2px solid #fff;box-shadow:0 2px 5px #0006}
.tok span{display:block;font-size:11px;color:#fff;font-weight:600;text-shadow:0 1px 3px #000;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tok.drag{cursor:grabbing;z-index:9}
.chip{padding:6px 10px;border:1px solid var(--bd);border-radius:20px;background:var(--card);color:var(--tx);font-size:13px}
.chip.out{opacity:.4}
.empty{color:var(--mu);text-align:center;padding:20px}
.ro-only{display:none}.ro .ro-only{display:block}.ro .rw{display:none!important}
.ban{background:var(--ac);color:#fff;text-align:center;padding:6px;font-size:13px}
</style>
</head>
<body>
<div class="ban ro-only">Versione in sola lettura</div>
<header><button id="t1" class="on">Rosa</button><button id="t2">Formazione</button></header>
<main>
<section id="v1">
  <div class="card rw">
    <div class="grid" id="form">
      <div class="full"><label>Nome</label><input id="name" placeholder="Es. Marco Rossi"></div>
      <div><label>Ruolo</label><select id="role"><option value="P">Portiere</option><option value="D">Difensore</option><option value="C">Centrocampista</option><option value="A">Attaccante</option></select></div>
      <div><label>N° maglia</label><input id="n" type="number" min="0" max="99"></div>
      <div><label>Data di nascita</label><input id="dob" type="date"></div>
      <div><label>Altezza (cm)</label><input id="h" type="number" min="0"></div>
      <div><label>Peso (kg)</label><input id="w" type="number" min="0"></div>
      <div><label>Gol</label><input id="g" type="number" min="0" value="0"></div>
      <div><label>Assist</label><input id="a" type="number" min="0" value="0"></div>
      <div><label>Presenze</label><input id="p" type="number" min="0" value="0"></div>
      <div class="full"><label>Descrizione</label><textarea id="desc" rows="2"></textarea></div>
    </div>
    <div class="row" style="margin-top:10px"><button class="btn" id="save">Aggiungi giocatore</button><button class="btn s" id="cancel" hidden>Annulla modifica</button></div>
  </div>
  <div class="card rw row"><button class="btn s" id="exp">Esporta dati</button><button class="btn s" id="imp">Importa dati</button><button class="btn" id="mis">Versione per il mister</button><input type="file" id="file" accept=".json,application/json" hidden></div>
  <div id="list"></div>
</section>
<section id="v2" hidden>
  <div class="card row rw">
    <select id="preset" style="width:auto"><option value="">Modulo…</option><option>4-4-2</option><option>4-3-3</option><option>3-5-2</option><option>4-2-3-1</option><option>5-3-2</option></select>
    <button class="btn s" id="clear">Svuota campo</button>
    <span class="st">Tocca un giocatore per metterlo in campo, trascinalo per spostarlo, doppio tocco per toglierlo.</span>
  </div>
  <div class="pitch" id="pitch">
    <svg viewBox="0 0 68 100" preserveAspectRatio="none" fill="none" stroke="#fff" stroke-width=".5">
      <line x1="0" y1="50" x2="68" y2="50"/><circle cx="34" cy="50" r="9"/>
      <rect x="14" y="0" width="40" height="16"/><rect x="25" y="0" width="18" height="6"/>
      <rect x="14" y="84" width="40" height="16"/><rect x="25" y="94" width="18" height="6"/>
    </svg>
  </div>
  <div class="card rw"><div class="row" id="bench"></div></div>
</section>
</main>
<script>
const $=id=>document.getElementById(id);
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const RN={P:'Portiere',D:'Difensore',C:'Centrocampista',A:'Attaccante'};
const EMBED=/*EMB*/null/*END*/,RO=EMBED!==null;
let S={players:[],pitch:{}},editId=null;
if(RO){S=EMBED;document.documentElement.classList.add('ro')}
else try{const r=localStorage.getItem('rosa-formazione');if(r)S=JSON.parse(r)}catch(e){}
S.players=S.players||[];S.pitch=S.pitch||{};
const save=()=>{if(RO)return;try{localStorage.setItem('rosa-formazione',JSON.stringify(S))}catch(e){}};
const ini=n=>n.trim().split(/\s+/).map(x=>x[0]).slice(0,2).join('').toUpperCase();
const last=n=>n.trim().split(/\s+/).slice(-1)[0];
const fmt=d=>d.split('-').reverse().join('/');
const age=d=>{const b=new Date(d),t=new Date();let a=t.getFullYear()-b.getFullYear();if(t.getMonth()<b.getMonth()||(t.getMonth()==b.getMonth()&&t.getDate()<b.getDate()))a--;return a};
const lab=p=>esc(p.n===undefined||p.n===''?ini(p.name):p.n);

function tab(n){$('v1').hidden=n!=1;$('v2').hidden=n!=2;$('t1').classList.toggle('on',n==1);$('t2').classList.toggle('on',n==2);if(n==2)drawPitch()}
$('t1').onclick=()=>tab(1);$('t2').onclick=()=>tab(2);

function renderList(){
  const L=$('list');
  if(!S.players.length){L.innerHTML='<div class="empty">Nessun giocatore. Aggiungine uno qui sopra.</div>';return}
  L.innerHTML=S.players.map(p=>`<div class="card p"><div class="badge ${p.role}">${lab(p)}</div><div style="flex:1;min-width:0">
  <b>${esc(p.name)}</b> <span class="st">· ${RN[p.role]}</span>
  <div class="st">${p.dob?`<b>${fmt(p.dob)}</b> (${age(p.dob)} anni) · `:''}${p.h?`<b>${esc(p.h)}</b> cm · `:''}${p.w?`<b>${esc(p.w)}</b> kg · `:''}<b>${p.g}</b> gol · <b>${p.a}</b> assist · <b>${p.p}</b> presenze</div>
  ${p.desc?`<div class="st" style="margin-top:4px">${esc(p.desc)}</div>`:''}
  <div class="row rw" style="margin-top:8px"><button class="btn s" data-e="${p.id}">Modifica</button><button class="btn d" data-d="${p.id}">Elimina</button></div></div></div>`).join('');
}
$('list').onclick=e=>{
  const ed=e.target.dataset.e,de=e.target.dataset.d;
  if(ed){const p=S.players.find(x=>x.id==ed);editId=p.id;
    $('name').value=p.name;$('n').value=p.n??'';$('dob').value=p.dob||'';$('role').value=p.role;$('h').value=p.h;$('w').value=p.w;$('g').value=p.g;$('a').value=p.a;$('p').value=p.p;$('desc').value=p.desc;
    $('save').textContent='Salva modifiche';$('cancel').hidden=false;scrollTo({top:0,behavior:'smooth'})}
  if(de&&confirm('Eliminare il giocatore?')){S.players=S.players.filter(x=>x.id!=de);delete S.pitch[de];save();renderList()}
};
function resetForm(){editId=null;['name','n','dob','h','w','desc'].forEach(i=>$(i).value='');['g','a','p'].forEach(i=>$(i).value=0);$('save').textContent='Aggiungi giocatore';$('cancel').hidden=true}
$('cancel').onclick=resetForm;
$('save').onclick=()=>{
  const name=$('name').value.trim();if(!name){$('name').focus();return}
  const d={name,n:$('n').value,dob:$('dob').value,role:$('role').value,h:$('h').value,w:$('w').value,g:+$('g').value||0,a:+$('a').value||0,p:+$('p').value||0,desc:$('desc').value.trim()};
  if(editId){Object.assign(S.players.find(x=>x.id==editId),d)}else{S.players.push({id:Date.now()+''+Math.floor(Math.random()*99),...d})}
  save();resetForm();renderList();
};

function drawPitch(){
  const pt=$('pitch');pt.querySelectorAll('.tok').forEach(n=>n.remove());
  S.players.filter(p=>S.pitch[p.id]).forEach(p=>{
    const t=document.createElement('div');t.className='tok';t.dataset.id=p.id;
    t.style.left=S.pitch[p.id].x+'%';t.style.top=S.pitch[p.id].y+'%';
    t.innerHTML=`<div class="badge ${p.role}">${lab(p)}</div><span>${esc(last(p.name))}</span>`;
    pt.appendChild(t);
  });
  $('bench').innerHTML=S.players.length?S.players.map(p=>`<button class="chip ${S.pitch[p.id]?'out':''}" data-id="${p.id}">${esc(p.name)} · ${p.role}</button>`).join(''):'<span class="empty">Aggiungi prima i giocatori nella Rosa.</span>';
}
$('bench').onclick=e=>{
  const id=e.target.dataset.id;if(!id||S.pitch[id])return;
  const n=Object.keys(S.pitch).length;
  S.pitch[id]={x:20+(n%4)*20,y:50+((n/4|0)%3)*12-12};save();drawPitch();
};
let drag=null,lastTap=0,lastId=null;
$('pitch').addEventListener('pointerdown',e=>{
  const t=e.target.closest('.tok');if(!t||RO)return;
  const now=Date.now();
  if(lastId==t.dataset.id&&now-lastTap<350){delete S.pitch[t.dataset.id];save();drawPitch();lastId=null;return}
  lastTap=now;lastId=t.dataset.id;
  drag=t;t.classList.add('drag');t.setPointerCapture(e.pointerId);
});
$('pitch').addEventListener('pointermove',e=>{
  if(!drag)return;
  const r=$('pitch').getBoundingClientRect();
  const x=Math.min(95,Math.max(5,(e.clientX-r.left)/r.width*100)),y=Math.min(96,Math.max(4,(e.clientY-r.top)/r.height*100));
  drag.style.left=x+'%';drag.style.top=y+'%';S.pitch[drag.dataset.id]={x,y};
});
const endDrag=()=>{if(drag){drag.classList.remove('drag');drag=null;save()}};
$('pitch').addEventListener('pointerup',endDrag);$('pitch').addEventListener('pointercancel',endDrag);
$('clear').onclick=()=>{S.pitch={};save();drawPitch()};
$('preset').onchange=e=>{
  const v=e.target.value;if(!v)return;
  const n=v.split('-').map(Number),gk=[[50,91]],lines=[];
  const ys=n.length==4?[74,56,38,22]:[74,50,24];
  n.forEach((c,i)=>lines.push(Array.from({length:c},(_,k)=>[(k+1)*100/(c+1),ys[i]])));
  const slots={P:gk,D:lines[0],C:n.length==4?[...lines[1],...lines[2]]:lines[1],A:lines[n.length-1]};
  const used={P:0,D:0,C:0,A:0};
  S.players.filter(p=>S.pitch[p.id]).forEach(p=>{const s=slots[p.role][used[p.role]++];if(s)S.pitch[p.id]={x:s[0],y:s[1]}});
  save();drawPitch();e.target.value='';
};
const dl=(name,txt,type)=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([txt],{type}));a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)};
$('exp').onclick=()=>dl('rosa-formazione.json',JSON.stringify(S,null,1),'application/json');
$('imp').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];if(!f)return;const r=new FileReader();r.onload=()=>{try{const d=JSON.parse(r.result);if(!Array.isArray(d.players))throw 0;if(!confirm('Sostituire i dati attuali con quelli importati?'))return;S={players:d.players,pitch:d.pitch||{}};save();renderList();drawPitch()}catch(x){alert('File non valido')}};r.readAsText(f);e.target.value=''};
$('mis').onclick=()=>{
  const c=document.documentElement.cloneNode(true);
  c.querySelector('#list').innerHTML='';c.querySelectorAll('.tok').forEach(n=>n.remove());c.querySelector('#bench').innerHTML='';
  const j=JSON.stringify(S).replace(/</g,'\\u003c');
  const html='<!DOCTYPE html>\n'+c.outerHTML.replace(/\/\*EMB\*\/.*?\/\*END\*\//,()=>'/*EMB*/'+j+'/*END*/');
  dl('formazione-mister.html',html,'text/html');
};
renderList();
if(RO)tab(1);
</script>
</body>
</html>
